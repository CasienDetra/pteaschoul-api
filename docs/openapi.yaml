openapi: 3.1.0
info:
  title: Rental Room API
  description: 'Rooms, tenants and monthly billing. A bill is **rent + metered electricity + metered water**;
    the tariff and rent in force are snapshotted onto every invoice.


    Bills are totalled and settled in the base currency, but a tenant may hand over any currency listed
    at `GET /` — the payment keeps the tender and the rate applied.


    Log in at `POST /api/v1/login`, then paste the `access_token` into **Authorize**.'
  version: 0.1.0
paths:
  /api/v1/login:
    post:
      tags:
      - auth
      summary: Log in (admin, staff or tenant)
      description: The only open endpoint. Tenants use the same route as staff — role comes off the row.
      operationId: login_api_v1_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/me:
    get:
      tags:
      - auth
      summary: Who am I
      operationId: me_api_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
      security:
      - HTTPBearer: []
  /api/v1/me/password:
    post:
      tags:
      - auth
      summary: Change my own password
      operationId: change_password_api_v1_me_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_change_password_api_v1_me_password_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/users:
    post:
      tags:
      - users
      summary: Create a staff (or admin) account — admin only
      description: Send as multipart/form-data. Default role is `staff`; pass `role=admin` for another
        admin.
      operationId: create_user_api_v1_users_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - users
      summary: List users
      operationId: list_users_api_v1_users_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Limit
      - name: role
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Role'
          - type: 'null'
          title: Role
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: match name or email
          title: Q
        description: match name or email
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_UserOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/{user_id}:
    get:
      tags:
      - users
      summary: Get one user
      operationId: get_user_api_v1_users__user_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - users
      summary: Update a user — admin only
      operationId: update_user_api_v1_users__user_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - users
      summary: Delete a user — admin only
      operationId: delete_user_api_v1_users__user_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/rooms:
    post:
      tags:
      - rooms
      summary: Create a room
      operationId: create_room_api_v1_rooms_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - rooms
      summary: List rooms with filters
      operationId: list_rooms_api_v1_rooms_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Limit
      - name: is_available
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: true = vacant
          title: Is Available
        description: true = vacant
      - name: min_price
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Min Price
      - name: max_price
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Max Price
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_RoomOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/rooms/reports/monthly:
    get:
      tags:
      - rooms
      summary: Billed vs collected for a month
      operationId: monthly_report_api_v1_rooms_reports_monthly_get
      security:
      - HTTPBearer: []
      parameters:
      - name: month
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 12
            minimum: 1
          - type: 'null'
          description: defaults to the current month
          title: Month
        description: defaults to the current month
      - name: year
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 2100
            minimum: 2000
          - type: 'null'
          title: Year
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyReport'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/rooms/{room_id}:
    get:
      tags:
      - rooms
      summary: Get one room
      operationId: get_room_api_v1_rooms__room_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - rooms
      summary: Update a room
      operationId: update_room_api_v1_rooms__room_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - rooms
      summary: Delete a room — admin only
      operationId: delete_room_api_v1_rooms__room_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tenants:
    post:
      tags:
      - tenants
      summary: Check a tenant into a vacant room
      description: Supply `email` + `password` to also issue the tenant a login for their own bills.
      operationId: create_tenant_api_v1_tenants_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - tenants
      summary: List tenants with filters
      operationId: list_tenants_api_v1_tenants_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Limit
      - name: is_active
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
      - name: room_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Room Id
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: match name or phone
          title: Q
        description: match name or phone
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_TenantOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tenants/{tenant_id}:
    get:
      tags:
      - tenants
      summary: Get one tenant
      operationId: get_tenant_api_v1_tenants__tenant_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: integer
          title: Tenant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - tenants
      summary: Check out — frees the room
      operationId: checkout_api_v1_tenants__tenant_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: integer
          title: Tenant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/invoices/generate:
    post:
      tags:
      - billing
      summary: Run monthly billing now (same job the scheduler runs on the 1st)
      description: Idempotent — rooms already invoiced for the period are skipped, so it is safe to re-run.
      operationId: generate_api_v1_invoices_generate_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/GenerateRequest'
              - type: 'null'
              title: Payload
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InvoiceOut'
                type: array
                title: Response Generate Api V1 Invoices Generate Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/invoices/scheduler-status:
    get:
      tags:
      - billing
      summary: Scheduler jobs and next run times
      operationId: scheduler_status_api_v1_invoices_scheduler_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Scheduler Status Api V1 Invoices Scheduler Status Get
      security:
      - HTTPBearer: []
  /api/v1/invoices:
    get:
      tags:
      - billing
      summary: List invoices (tenants see only their own)
      operationId: list_invoices_api_v1_invoices_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          title: Limit
      - name: month
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 12
            minimum: 1
          - type: 'null'
          title: Month
      - name: year
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 2100
            minimum: 2000
          - type: 'null'
          title: Year
      - name: room_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Room Id
      - name: tenant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tenant Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/InvoiceStatus'
          - type: 'null'
          title: Status
      - name: overdue
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: true = unpaid and past the due date
          title: Overdue
        description: true = unpaid and past the due date
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_InvoiceOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/invoices/{invoice_id}:
    get:
      tags:
      - billing
      summary: One bill, itemised
      operationId: get_invoice_api_v1_invoices__invoice_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: integer
          title: Invoice Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/invoices/{invoice_id}/reading:
    put:
      tags:
      - billing
      summary: Record end-of-month meters — recomputes the total
      operationId: record_reading_api_v1_invoices__invoice_id__reading_put
      security:
      - HTTPBearer: []
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: integer
          title: Invoice Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/invoices/{invoice_id}/payments:
    post:
      tags:
      - billing
      summary: Take a full or partial payment, in any accepted currency
      description: '`amount` is denominated in `currency` (the base currency unless given). The balance

        moves by the converted base amount; the tender and the rate stay on the payment row.'
      operationId: pay_api_v1_invoices__invoice_id__payments_post
      security:
      - HTTPBearer: []
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: integer
          title: Invoice Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /:
    get:
      tags:
      - meta
      summary: Service info
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Root  Get
components:
  schemas:
    Body_change_password_api_v1_me_password_post:
      properties:
        current_password:
          type: string
          minLength: 1
          title: Current Password
        new_password:
          type: string
          maxLength: 128
          minLength: 8
          title: New Password
      type: object
      required:
      - current_password
      - new_password
      title: Body_change_password_api_v1_me_password_post
    CheckoutResult:
      properties:
        message:
          type: string
          title: Message
        tenant:
          $ref: '#/components/schemas/TenantOut'
        outstanding:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Outstanding
      type: object
      required:
      - message
      - tenant
      - outstanding
      title: CheckoutResult
    DeviceInfo:
      properties:
        ip:
          type: string
          title: Ip
        os:
          type: string
          title: Os
        browser:
          type: string
          title: Browser
        device:
          type: string
          title: Device
        user_agent:
          type: string
          title: User Agent
      type: object
      required:
      - ip
      - os
      - browser
      - device
      - user_agent
      title: DeviceInfo
    GenerateRequest:
      properties:
        month:
          anyOf:
          - type: integer
            maximum: 12.0
            minimum: 1.0
          - type: 'null'
          title: Month
        year:
          anyOf:
          - type: integer
            maximum: 2100.0
            minimum: 2000.0
          - type: 'null'
          title: Year
      type: object
      title: GenerateRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InvoiceOut:
      properties:
        id:
          type: integer
          title: Id
        room_id:
          type: integer
          title: Room Id
        tenant_id:
          type: integer
          title: Tenant Id
        room_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Room Name
        tenant_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Name
        month:
          type: integer
          title: Month
        year:
          type: integer
          title: Year
        room_price:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Room Price
        electricity_prev:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Electricity Prev
        electricity_curr:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Electricity Curr
        electricity_units:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Electricity Units
        electricity_rate:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Electricity Rate
        electricity_charge:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Electricity Charge
        water_prev:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Water Prev
        water_curr:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Water Curr
