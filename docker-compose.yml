services:
  postgres:
    image: postgres:16
    container_name: rental_room_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin2026}
      POSTGRES_DB: ${POSTGRES_DB:-db_room}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-db_room}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rental_room

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rental_room_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin2026}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - rental_room

volumes:
  postgres_data:
  pgadmin_data:

networks:
  rental_room:
    driver: bridge
