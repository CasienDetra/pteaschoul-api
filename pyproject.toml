[project]
name = "api-rental-room"
version = "0.1.0"
description = "Rental room API: JWT auth, staff management, monthly utility invoicing"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.133.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.1",
    "argon2-cffi>=23.1.0",
    "apscheduler>=3.11.0,<4",
]

[tool.uv]
package = false
